name: iOS Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# ---------------------------------------------------------------------------
# What this does
# - Always: compile the Swift package on a macOS runner (no device install).
# - Optional: archive/export IPA only if you later add an .xcodeproj + secrets.
#
# What this does NOT do by itself
# - Install the app on your iPhone
# - Replace Xcode on a Mac for signing setup
# - Work without Apple certificates for a distributable IPA
# ---------------------------------------------------------------------------

jobs:
  # --- Job 1: always useful — validates Swift/SwiftUI package compiles ---
  package-build:
    name: Swift package (macOS)
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode
        run: xcodebuild -version

      - name: Resolve packages
        run: swift package resolve

      - name: Build package
        run: swift build -v

  # --- Job 2: template for real IPA (skipped until project + secrets exist) ---
  ipa-archive:
    name: IPA archive (optional)
    runs-on: macos-14
    timeout-minutes: 45
    # Only runs when you set repository variable ENABLE_IPA_BUILD=true
    # and provide signing secrets (see docs/IOS_BUILD.md).
    if: ${{ vars.ENABLE_IPA_BUILD == 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Xcode project
        run: |
          if [ ! -d "AjuUtilApp.xcodeproj" ] && [ ! -d "AjuUtilApp.xcworkspace" ]; then
            echo "No AjuUtilApp.xcodeproj/xcworkspace found."
            echo "Create an iOS App target on a Mac first, then enable this job."
            exit 1
          fi

      - name: Import certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [ -z "$BUILD_CERTIFICATE_BASE64" ]; then
            echo "Missing BUILD_CERTIFICATE_BASE64 secret"
            exit 1
          fi
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

      - name: Install provisioning profile
        env:
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          if [ -z "$BUILD_PROVISION_PROFILE_BASE64" ]; then
            echo "Missing BUILD_PROVISION_PROFILE_BASE64 secret"
            exit 1
          fi
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          uuid=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< $(security cms -D -i $PP_PATH))
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/$uuid.mobileprovision

      - name: Archive
        run: |
          xcodebuild archive \
            -project AjuUtilApp.xcodeproj \
            -scheme AjuUtilApp \
            -configuration Release \
            -archivePath $RUNNER_TEMP/AjuUtil.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}"

      - name: Export IPA
        run: |
          cat > $RUNNER_TEMP/ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>ad-hoc</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>${{ secrets.APPLE_TEAM_ID }}</string>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/AjuUtil.xcarchive \
            -exportPath $RUNNER_TEMP/ipa \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AjuUtil-IPA
          path: ${{ runner.temp }}/ipa/*.ipa
          if-no-files-found: error

name: iOS Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "Sources/**"
      - "AjuUtilApp/**"
      - "AjuUtilApp.xcodeproj/**"
      - "Package.swift"
      - ".github/workflows/ios-build.yml"

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --- Always attempt package + simulator app build (no Apple certs needed) ---
  build:
    name: Build (macOS)
    runs-on: macos-14
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Show tools
        run: |
          xcodebuild -version
          swift --version

      - name: Resolve SPM
        run: swift package resolve

      - name: Build Swift package
        run: swift build

      - name: Build app for iOS Simulator (no signing)
        run: |
          set -euo pipefail
          xcodebuild \
            -project AjuUtilApp.xcodeproj \
            -scheme AjuUtilApp \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Upload simulator app (optional artifact)
        uses: actions/upload-artifact@v4
        with:
          name: AjuUtilApp-Simulator
          path: |
            ${{ runner.temp }}/DerivedData/Build/Products/Debug-iphonesimulator/AjuUtilApp.app
          if-no-files-found: warn

  # --- Signed IPA only when explicitly enabled + secrets present ---
  ipa:
    name: Signed IPA
    needs: build
    runs-on: macos-14
    timeout-minutes: 45
    if: ${{ vars.ENABLE_IPA_BUILD == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check signing secrets
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          for v in BUILD_CERTIFICATE_BASE64 BUILD_PROVISION_PROFILE_BASE64 APPLE_TEAM_ID P12_PASSWORD KEYCHAIN_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::error::Missing secret $v"
              exit 1
            fi
          done

      - name: Import certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERT="$RUNNER_TEMP/cert.p12"
          KC="$RUNNER_TEMP/signing.keychain-db"
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 -D -o "$CERT"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KC"
          security import "$CERT" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KC"
          security list-keychain -d user -s "$KC"

      - name: Install provisioning profile
        env:
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          PP="$RUNNER_TEMP/profile.mobileprovision"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 -D -o "$PP"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          UUID=$(security cms -D -i "$PP" | plutil -extract UUID raw -)
          cp "$PP" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"

      - name: Archive & export Ad Hoc IPA
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project AjuUtilApp.xcodeproj \
            -scheme AjuUtilApp \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/AjuUtil.xcarchive" \
            -destination "generic/platform=iOS" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID"

          EXPORT="$RUNNER_TEMP/ExportOptions.plist"
          plutil -create xml1 "$EXPORT"
          plutil -insert method -string ad-hoc "$EXPORT"
          plutil -insert signingStyle -string manual "$EXPORT"
          plutil -insert teamID -string "$APPLE_TEAM_ID" "$EXPORT"

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/AjuUtil.xcarchive" \
            -exportPath "$RUNNER_TEMP/ipa" \
            -exportOptionsPlist "$EXPORT"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AjuUtil-IPA
          path: ${{ runner.temp }}/ipa/*.ipa
          if-no-files-found: error

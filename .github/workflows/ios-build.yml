name: iOS Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Compiles the Swift package. Requires a working macOS runner (account minutes/permissions).
  package-build:
    name: Swift package (macOS)
    runs-on: macos-14
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Swift version
        run: swift --version

      - name: Resolve packages
        run: swift package resolve

      - name: Build
        run: swift build

  # Optional IPA — only when repo variable ENABLE_IPA_BUILD=true
  # Needs AjuUtilApp.xcodeproj + signing secrets (see docs/IOS_BUILD.md).
  ipa-archive:
    name: IPA archive (optional)
    needs: package-build
    runs-on: macos-14
    timeout-minutes: 45
    if: ${{ vars.ENABLE_IPA_BUILD == 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require Xcode app project
        run: |
          set -euo pipefail
          if [ ! -d "AjuUtilApp.xcodeproj" ] && [ ! -d "AjuUtilApp.xcworkspace" ]; then
            echo "::error::Missing AjuUtilApp.xcodeproj — create the iOS app target on a Mac first."
            exit 1
          fi

      - name: Import signing certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${BUILD_CERTIFICATE_BASE64}" ]; then
            echo "::error::Secret BUILD_CERTIFICATE_BASE64 is required"
            exit 1
          fi
          CERTIFICATE_PATH="${RUNNER_TEMP}/build_certificate.p12"
          KEYCHAIN_PATH="${RUNNER_TEMP}/app-signing.keychain-db"
          echo -n "${BUILD_CERTIFICATE_BASE64}" | base64 -D -o "${CERTIFICATE_PATH}"
          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security import "${CERTIFICATE_PATH}" -P "${P12_PASSWORD}" -A -t cert -f pkcs12 -k "${KEYCHAIN_PATH}"
          security set-key-partition-list -S apple-tool:,apple: -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security list-keychain -d user -s "${KEYCHAIN_PATH}"

      - name: Install provisioning profile
        env:
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${BUILD_PROVISION_PROFILE_BASE64}" ]; then
            echo "::error::Secret BUILD_PROVISION_PROFILE_BASE64 is required"
            exit 1
          fi
          PP_PATH="${RUNNER_TEMP}/build_pp.mobileprovision"
          echo -n "${BUILD_PROVISION_PROFILE_BASE64}" | base64 -D -o "${PP_PATH}"
          mkdir -p "${HOME}/Library/MobileDevice/Provisioning Profiles"
          UUID=$(security cms -D -i "${PP_PATH}" | plutil -extract UUID raw -)
          cp "${PP_PATH}" "${HOME}/Library/MobileDevice/Provisioning Profiles/${UUID}.mobileprovision"
          echo "Installed profile ${UUID}"

      - name: Archive
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_TEAM_ID}" ]; then
            echo "::error::Secret APPLE_TEAM_ID is required"
            exit 1
          fi
          xcodebuild archive \
            -project AjuUtilApp.xcodeproj \
            -scheme AjuUtilApp \
            -configuration Release \
            -archivePath "${RUNNER_TEMP}/AjuUtil.xcarchive" \
            -destination "generic/platform=iOS" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="${APPLE_TEAM_ID}"

      - name: Export IPA
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          EXPORT_PLIST="${RUNNER_TEMP}/ExportOptions.plist"
          plutil -create xml1 "${EXPORT_PLIST}"
          plutil -insert method -string ad-hoc "${EXPORT_PLIST}"
          plutil -insert signingStyle -string manual "${EXPORT_PLIST}"
          plutil -insert teamID -string "${APPLE_TEAM_ID}" "${EXPORT_PLIST}"
          xcodebuild -exportArchive \
            -archivePath "${RUNNER_TEMP}/AjuUtil.xcarchive" \
            -exportPath "${RUNNER_TEMP}/ipa" \
            -exportOptionsPlist "${EXPORT_PLIST}"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AjuUtil-IPA
          path: ${{ runner.temp }}/ipa/*.ipa
          if-no-files-found: error

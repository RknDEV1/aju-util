name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check structure
        run: |
          test -f Package.swift
          test -f Sources/AjuUtil/Resources/items.json
          test -d Sources/AjuUtil/Features
          echo "Aju Util structure OK"
